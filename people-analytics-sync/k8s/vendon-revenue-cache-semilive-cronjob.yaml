# Semi-live refresh: today + yesterday every 15 minutes (Kuwait calendar).
# Prevents revenue cache from sticking on an early-morning snapshot when Alert
# traffic is quiet. Daily vendon-revenue-cache-refresh still does gap-fill + deep reconcile.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vendon-revenue-cache-semilive
  namespace: leet-monitor
spec:
  schedule: "*/15 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 1800
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.5.0
              imagePullPolicy: IfNotPresent
              env:
                - name: DASHBOARD_ACCESS_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: people-analytics-secrets
                      key: dashboard-access-api-key
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  SECRET="X-Dashboard-Access-Secret:${DASHBOARD_ACCESS_API_KEY}"
                  URL="http://people-analytics-api/api/vendon/internal/cache-revenue"
                  TODAY=$(TZ=Asia/Kuwait date +%Y-%m-%d)
                  YEST=$(TZ=Asia/Kuwait date -d 'yesterday' +%Y-%m-%d)
                  echo "semilive refresh $TODAY $YEST"
                  curl -fsS --connect-timeout 10 --max-time 600 --retry 2 --retry-delay 5 \
                    -X POST "$URL" -H "Content-Type: application/json" -H "$SECRET" \
                    -d "{\"date\":\"$TODAY\"}"
                  curl -fsS --connect-timeout 10 --max-time 600 --retry 2 --retry-delay 5 \
                    -X POST "$URL" -H "Content-Type: application/json" -H "$SECRET" \
                    -d "{\"date\":\"$YEST\"}"
                  curl -fsS --connect-timeout 10 --max-time 600 --retry 1 --retry-delay 5 \
                    -X POST "$URL" -H "Content-Type: application/json" -H "$SECRET" \
                    -d "{\"reconcile\":true,\"sync\":true,\"maxDays\":2,\"dates\":[\"$TODAY\",\"$YEST\"],\"newestFirst\":true}"
