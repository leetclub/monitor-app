# Warms alert_daily_sales_elapsed_cache (fleet Today / Yest. same time / Yest. full day).
# Schedule: every minute — today totals must track live Vendon through the current clock.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: alert-daily-sales-elapsed-refresh
  namespace: leet-monitor
spec:
  schedule: "*/1 * * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      backoffLimit: 1
      activeDeadlineSeconds: 540
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.5.0
              imagePullPolicy: IfNotPresent
              env:
                - name: DASHBOARD_ACCESS_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: people-analytics-secrets
                      key: dashboard-access-api-key
              command:
                - /bin/sh
                - -c
                - >
                  exec curl -fsS
                  --connect-timeout 10
                  --max-time 480
                  --retry 1
                  --retry-delay 5
                  -X POST "http://people-analytics-api/api/alert/internal/daily-sales-elapsed-refresh"
                  -H "X-Dashboard-Access-Secret:${DASHBOARD_ACCESS_API_KEY}"
