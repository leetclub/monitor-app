# Warms attendance_snapshot_cache for Kuwait yesterday + today.
# Purpose: Alert Live Op / Tech Visit + GAS Attendance read proven presence.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: attendance-snapshot-cache-warm
  namespace: leet-monitor
spec:
  # 00:20 UTC ≈ 03:20 Kuwait; also mid-day refresh so "today" is not empty all morning
  schedule: "20 0,9 * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 900
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.5.0
              imagePullPolicy: IfNotPresent
              env:
                - name: DASHBOARD_ACCESS_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: people-analytics-secrets
                      key: dashboard-access-api-key
              command:
                - /bin/sh
                - -c
                - >
                  set -e;
                  AUTH="X-Dashboard-Access-Secret:${DASHBOARD_ACCESS_API_KEY}";
                  URL="http://people-analytics-api/api/attendance/internal/warm";
                  curl -fsS --connect-timeout 10 --max-time 1200 --retry 2 --retry-delay 10
                  -X POST "$URL" -H "Content-Type: application/json" -H "$AUTH" -d "{}";
                  curl -fsS --connect-timeout 10 --max-time 1200 --retry 2 --retry-delay 10
                  -X POST "$URL" -H "Content-Type: application/json" -H "$AUTH"
                  -d "{\"date\":\"$(TZ=Asia/Kuwait date +%F)\"}"
