# Midday + evening audit: reconcile last 7 completed days vs live Vendon and auto-refresh drift.
# Runs without human monitoring — if cache drifts, it fixes itself.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vendon-revenue-cache-audit-fix
  namespace: leet-monitor
spec:
  # 09:30 and 18:30 UTC ≈ 12:30 and 21:30 Kuwait
  schedule: "30 9,18 * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.5.0
              imagePullPolicy: IfNotPresent
              env:
                - name: DASHBOARD_ACCESS_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: people-analytics-secrets
                      key: dashboard-access-api-key
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  SECRET="X-Dashboard-Access-Secret:${DASHBOARD_ACCESS_API_KEY}"
                  URL="http://people-analytics-api/api/vendon/internal/cache-revenue"
                  echo "audit-fix reconcile last 7 days + gap fill"
                  post() {
                    body="$1"
                    maxt="${2:-3200}"
                    code=$(curl -sS -o /tmp/rr.json -w "%{http_code}" \
                      --connect-timeout 10 --max-time "$maxt" --retry 2 --retry-delay 5 \
                      -X POST "$URL" -H "Content-Type: application/json" -H "$SECRET" \
                      -d "$body" || echo 000)
                    echo "http=$code body=$(head -c 400 /tmp/rr.json 2>/dev/null)"
                    case "$code" in
                      200|207) return 0 ;;
                      *) return 1 ;;
                    esac
                  }
                  post '{"fillGaps":true,"maxDays":14,"sync":true}' 3200
                  post '{"reconcile":true,"maxDays":7,"sync":true,"newestFirst":true}' 3200
                  echo DONE
