# Warms alert_workflow_attendance_cache for fast Live Op reads.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: alert-workflow-attendance-refresh
  namespace: leet-monitor
spec:
  schedule: "*/3 * * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.5.0
              imagePullPolicy: IfNotPresent
              env:
                - name: DASHBOARD_ACCESS_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: people-analytics-secrets
                      key: dashboard-access-api-key
              command:
                - /bin/sh
                - -c
                - >
                  exec curl -fsS
                  --connect-timeout 10
                  --max-time 300
                  --retry 2
                  --retry-delay 2
                  -X POST "http://people-analytics-api/api/alert/internal/workflow-attendance-refresh"
                  -H "X-Dashboard-Access-Secret:${DASHBOARD_ACCESS_API_KEY}"
