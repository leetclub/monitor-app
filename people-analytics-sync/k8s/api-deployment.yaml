apiVersion: apps/v1
kind: Deployment
metadata:
  name: people-analytics-api
  namespace: leet-monitor
spec:
  # Single replica: commercial footfall report cache is in-process memory.
  replicas: 1
  selector:
    matchLabels:
      app: people-analytics-api
  template:
    metadata:
      labels:
        app: people-analytics-api
    spec:
      containers:
      - name: api
        image: programmeradmin25/people-analytics-sync:api-latest
        imagePullPolicy: Always
        # Note: Update image to your registry URL
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: people-analytics-secrets
              key: db-host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: people-analytics-secrets
              key: db-port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: people-analytics-secrets
              key: db-name
        - name: DASHBOARD_DB_NAME
          value: "monitoring_dashboard"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: people-analytics-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: people-analytics-secrets
              key: db-password
        - name: API_PORT
          value: "5000"
        - name: DEBUG
          value: "false"
        - name: ENV
          value: "production"
        - name: SESSION_LIFETIME_HOURS
          value: "12"
        - name: MAX_CONTENT_LENGTH_BYTES
          value: "2097152"
        - name: CORS_ALLOWED_ORIGINS
          # Allow GAS web app randomized subdomains (script.googleusercontent.com uses n-<rand>-script.googleusercontent.com)
          value: "https://monitor-v2.theleetclub.com,https://alert.theleetclub.com,https://performance.theleetclub.com,https://target.theleetclub.com,https://targets.theleetclub.com,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,https://script.googleusercontent.com,https://.*-script\\.googleusercontent\\.com"
        - name: TARGET_SITE_ADMIN_USER
          value: "admin"
        - name: TARGET_SITE_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: people-analytics-secrets
              key: target-site-admin-password
              optional: true
        - name: COMMERCIAL_FOOTFALL_CACHE_TTL_SEC
          value: "86400"
        - name: DASHBOARD_SUPER_ADMIN_EMAILS
          valueFrom:
            secretKeyRef:
              name: people-analytics-secrets
              key: dashboard-super-admin-emails
              optional: true
        - name: SLACK_WEBHOOK_PROXY_PREFIX
          valueFrom:
            secretKeyRef:
              name: people-analytics-secrets
              key: slack-webhook-proxy-prefix
              optional: true
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: people-analytics-secrets
              key: google-client-id
              optional: true
        - name: FLASK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: people-analytics-secrets
              key: flask-secret-key
              optional: true
        - name: DASHBOARD_ACCESS_API_KEY
          valueFrom:
            secretKeyRef:
              name: people-analytics-secrets
              key: dashboard-access-api-key
              optional: true
        - name: ACCESS_ALLOWED_EMAIL_DOMAINS
          value: "theleetclub.com,almaghrebrd.com"
        - name: VENDON_API_KEY
          valueFrom:
            secretKeyRef:
              name: people-analytics-secrets
              key: vendon-api-key
              optional: true
        - name: VENDON_API_BASE
          value: "https://cloud.vendon.net/rest/v1.9.0"
        - name: VIDEOLOFT_EMAIL
          valueFrom:
            secretKeyRef:
              name: people-analytics-secrets
              key: videoloft-email
        - name: VIDEOLOFT_USERNAME
          valueFrom:
            secretKeyRef:
              name: people-analytics-secrets
              key: videoloft-username
              optional: true
        - name: VIDEOLOFT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: people-analytics-secrets
              key: videoloft-password
        # General Cleaning (v2): maintenance uses full URL https://cloud.vendon.net/rest/head/... — not under VENDON_API_BASE.
        # Code defaults correctly; only set VENDON_PREVENTATIVE_MAINTENANCE_URL if Vendon changes the path.
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: monitoring-app-v2-secrets
              key: SLACK_WEBHOOK_URL
              optional: true
        # --- Red Alert operator email alerts (optional; safe defaults = disabled) ---
        - name: RED_ALERT_EMAIL_ENABLED
          value: "false"
        - name: RED_ALERT_EMAIL_COOLDOWN_MIN
          value: "180"
        - name: RED_ALERT_FROM_EMAIL
          valueFrom:
            secretKeyRef:
              name: people-analytics-secrets
              key: red-alert-from-email
              optional: true
        - name: RED_ALERT_SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: people-analytics-secrets
              key: red-alert-smtp-host
              optional: true
        - name: RED_ALERT_SMTP_PORT
          valueFrom:
            secretKeyRef:
              name: people-analytics-secrets
              key: red-alert-smtp-port
              optional: true
        - name: RED_ALERT_SMTP_USER
          valueFrom:
            secretKeyRef:
              name: people-analytics-secrets
              key: red-alert-smtp-user
              optional: true
        - name: RED_ALERT_SMTP_PASS
          valueFrom:
            secretKeyRef:
              name: people-analytics-secrets
              key: red-alert-smtp-pass
              optional: true
        - name: SLACK_TEAM_ID
          valueFrom:
            secretKeyRef:
              name: monitoring-app-v2-secrets
              key: SLACK_WORKSPACE_ID
              optional: true
        - name: SLACK_OP_EMAIL_MAP_JSON
          valueFrom:
            secretKeyRef:
              name: people-analytics-secrets
              key: slack-op-email-map-json
              optional: true
        - name: OPERATOR_CONTACT_MAP_JSON
          valueFrom:
            secretKeyRef:
              name: people-analytics-secrets
              key: operator-contact-map-json
              optional: true
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: monitoring-app-v2-secrets
              key: SLACK_BOT_TOKEN
              optional: true
        - name: SLACK_USER_TOKEN
          valueFrom:
            secretKeyRef:
              name: monitoring-app-v2-secrets
              key: SLACK_USER_TOKEN
              optional: true
        - name: SAFETY_CULTURE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: monitoring-app-v2-secrets
              key: SAFETY_CULTURE_API_TOKEN
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: monitoring-app-v2-secrets
              key: OPENAI_API_KEY
              optional: true
        - name: OPENAI_MODEL
          value: "gpt-4o-mini"
        - name: SLACK_ISSUES_ACTIONS_LIST_ID
          valueFrom:
            secretKeyRef:
              name: monitoring-app-v2-secrets
              key: SLACK_ISSUES_ACTIONS_LIST_ID
              optional: true
        - name: SLACK_COOKIE_TOKEN
          valueFrom:
            secretKeyRef:
              name: monitoring-app-v2-secrets
              key: SLACK_COOKIE_TOKEN
              optional: true
        - name: SLACK_COOKIE_HEADER
          valueFrom:
            secretKeyRef:
              name: monitoring-app-v2-secrets
              key: SLACK_COOKIE_HEADER
              optional: true
        - name: SLACK_WORKSPACE_HOST
          valueFrom:
            secretKeyRef:
              name: monitoring-app-v2-secrets
              key: SLACK_WORKSPACE_HOST
              optional: true
        - name: LEET_WORKFLOW_API_BASE
          value: "https://workflow.theleetclub.com"
        - name: LEET_WORKFLOW_API_KEY
          valueFrom:
            secretKeyRef:
              name: people-analytics-secrets
              key: leet-workflow-api-key
              optional: true
        - name: LEET_WORKFLOW_API_TIMEOUT_SEC
          value: "30"
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "768Mi"
            # Performance fleet + background cache seeds pegged 1500m and starved /health probes.
            cpu: "2500m"
        startupProbe:
          httpGet:
            path: /health
            port: 5000
          failureThreshold: 30
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 30
          failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: people-analytics-api
  namespace: leet-monitor
spec:
  selector:
    app: people-analytics-api
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
  type: ClusterIP

