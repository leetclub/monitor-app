apiVersion: batch/v1
kind: CronJob
metadata:
  name: people-analytics-sync
  namespace: leet-monitor
spec:
  # Live sync: every 5 minutes — all cameras, re-upsert rolling window from Videoloft (see SYNC_LIVE_DAYS)
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  # Keep 3 successful and 1 failed job
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: people-analytics-sync
        spec:
          restartPolicy: OnFailure
          containers:
          - name: sync
            image: programmeradmin25/people-analytics-sync:latest
            imagePullPolicy: Always
            # Note: Update image to your registry URL
            env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: people-analytics-secrets
                  key: db-host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: people-analytics-secrets
                  key: db-port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: people-analytics-secrets
                  key: db-name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: people-analytics-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: people-analytics-secrets
                  key: db-password
            - name: VIDEOLOFT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: people-analytics-secrets
                  key: videoloft-email
                  optional: true
            - name: VIDEOLOFT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: people-analytics-secrets
                  key: videoloft-username
                  optional: true
            - name: VIDEOLOFT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: people-analytics-secrets
                  key: videoloft-password
            - name: SYNC_DAYS_BACK
              value: "0"
            # Rolling live window (Kuwait calendar days, all machines). Catches Videoloft bucket revisions.
            - name: SYNC_LIVE_DAYS
              value: "14"
            - name: SYNC_PER_DEVICE
              value: "1"
            - name: SYNC_INTERVAL
              value: "hour"
            - name: SYNC_CHUNK_DAYS
              value: "1"
            # Daily totals come from API hour aggregation — do not store parallel date rows.
            - name: SYNC_ALSO_DATE
              value: "0"
            - name: TIMEZONE
              value: "Asia/Kuwait"
            resources:
              requests:
                memory: "384Mi"
                cpu: "200m"
              limits:
                memory: "768Mi"
                cpu: "750m"

