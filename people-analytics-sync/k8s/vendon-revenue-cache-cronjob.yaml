# Nightly deep self-heal: fill YTD/LY gaps + reconcile newest days vs live Vendon.
# BusyBox-safe date math (curlimages/curl). Do not use `date -d yesterday`.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vendon-revenue-cache-refresh
  namespace: leet-monitor
spec:
  schedule: "15 0 * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.5.0
              imagePullPolicy: IfNotPresent
              env:
                - name: DASHBOARD_ACCESS_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: people-analytics-secrets
                      key: dashboard-access-api-key
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  SECRET="X-Dashboard-Access-Secret:${DASHBOARD_ACCESS_API_KEY}"
                  URL="http://people-analytics-api/api/vendon/internal/cache-revenue"
                  NOW=$(TZ=Asia/Kuwait date +%s)
                  TODAY=$(TZ=Asia/Kuwait date -d "@$NOW" +%Y-%m-%d)
                  YEST=$(TZ=Asia/Kuwait date -d "@$((NOW - 86400))" +%Y-%m-%d)
                  echo "nightly refresh $TODAY $YEST"
                  post() {
                    body="$1"
                    maxt="${2:-900}"
                    code=$(curl -sS -o /tmp/rr.json -w "%{http_code}" \
                      --connect-timeout 10 --max-time "$maxt" --retry 2 --retry-delay 5 \
                      -X POST "$URL" -H "Content-Type: application/json" -H "$SECRET" \
                      -d "$body" || echo 000)
                    echo "http=$code body=$(head -c 240 /tmp/rr.json 2>/dev/null)"
                    case "$code" in
                      200|207) return 0 ;;
                      *) return 1 ;;
                    esac
                  }
                  post "{\"date\":\"$TODAY\"}" 900
                  post "{\"date\":\"$YEST\"}" 900
                  post '{"fillGaps":true,"maxDays":25,"sync":true}' 3200
                  post '{"reconcile":true,"maxDays":15,"sync":true,"newestFirst":true}' 3200
                  echo DONE
