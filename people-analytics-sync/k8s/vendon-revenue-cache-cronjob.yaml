# Refreshes vendon_daily_machine_revenue_cache for today + yesterday, then
# fills oldest missing days in fleet YTD / LY YTD windows (so Alert bar never
# undercounts from hollow cache again).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vendon-revenue-cache-refresh
  namespace: leet-monitor
spec:
  schedule: "15 0 * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.5.0
              imagePullPolicy: IfNotPresent
              env:
                - name: DASHBOARD_ACCESS_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: people-analytics-secrets
                      key: dashboard-access-api-key
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  SECRET="X-Dashboard-Access-Secret:${DASHBOARD_ACCESS_API_KEY}"
                  URL="http://people-analytics-api/api/vendon/internal/cache-revenue"
                  # Kuwait "today" / "yesterday" (UTC+3) — keep aligned with ops calendar.
                  TODAY=$(TZ=Asia/Kuwait date +%Y-%m-%d)
                  YEST=$(TZ=Asia/Kuwait date -d 'yesterday' +%Y-%m-%d)
                  curl -fsS --connect-timeout 10 --max-time 900 --retry 2 --retry-delay 5 \
                    -X POST "$URL" -H "Content-Type: application/json" -H "$SECRET" \
                    -d "{\"date\":\"$TODAY\"}"
                  curl -fsS --connect-timeout 10 --max-time 900 --retry 2 --retry-delay 5 \
                    -X POST "$URL" -H "Content-Type: application/json" -H "$SECRET" \
                    -d "{\"date\":\"$YEST\"}"
                  # Fill up to 25 oldest missing days across this YTD + last YTD (sync).
                  curl -fsS --connect-timeout 10 --max-time 3200 --retry 1 --retry-delay 10 \
                    -X POST "$URL" -H "Content-Type: application/json" -H "$SECRET" \
                    -d '{"fillGaps":true,"maxDays":25,"sync":true}'
                  # Reconcile up to 15 newest days vs live Vendon (customer sales); refresh drift.
                  curl -fsS --connect-timeout 10 --max-time 3200 --retry 1 --retry-delay 10 \
                    -X POST "$URL" -H "Content-Type: application/json" -H "$SECRET" \
                    -d '{"reconcile":true,"maxDays":15,"sync":true,"newestFirst":true}'
