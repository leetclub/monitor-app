<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APOS 3D Constellation | Leet Alert</title>
  <style id="critical-bg">html,body{margin:0;height:100%;background:#04080e;color:#e2e8f0;overflow:hidden}</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="apos-map-gemini.css">
  <link rel="stylesheet" href="apos-3d-map.css">
  <link rel="icon" href="/favicon.ico">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="map3d-app" id="map3d-app">
    <header class="map3d-top">
      <div class="brand-mark" aria-label="APOS">
        <img class="brand-logo" src="assets/apos-logo.png" alt="apos" width="120" height="28" />
        <span class="brand-sub">3d constellation</span>
      </div>
      <div class="view-toggle" role="tablist" aria-label="View mode">
        <button type="button" class="toggle-btn active" data-view="graph" role="tab" aria-selected="true">Graph</button>
        <button type="button" class="toggle-btn" data-view="hud" role="tab" aria-selected="false">HUD</button>
      </div>
    </header>

    <main class="map3d-stage" id="map3d-stage">
      <canvas id="map3d-canvas" class="map3d-canvas" aria-label="APOS 3D hierarchy constellation"></canvas>
      <div class="map-vignette" aria-hidden="true"></div>
      <div class="map3d-hint" id="map3d-hint">Drag to orbit · scroll to zoom · click to focus</div>
      <div class="zoom-controls" aria-label="Camera">
        <button type="button" class="zoom-btn" data-action="zoom-in" title="Zoom in">+</button>
        <button type="button" class="zoom-btn" data-action="zoom-out" title="Zoom out">−</button>
        <button type="button" class="zoom-btn" data-action="reset" title="Galaxy view">○</button>
      </div>
    </main>

    <!-- HUD cockpit frame -->
    <aside class="hud-panel hud-left" id="hud-left" hidden>
      <h4>Portfolio</h4>
      <ul id="hud-clients"></ul>
    </aside>
    <aside class="hud-panel hud-right" id="hud-right" hidden>
      <h4>Team · Alerts</h4>
      <ul id="hud-alerts"></ul>
    </aside>
    <footer class="hud-bottom" id="hud-bottom" hidden>
      <div class="hud-term-chrome">APOS // COMMAND</div>
      <div id="hud-term-log" class="hud-term-log"></div>
    </footer>

    <nav class="map3d-crumb" aria-label="Hierarchy breadcrumb">
      <button type="button" class="nav-chevron" data-dir="prev" title="Go back" aria-label="Previous">‹</button>
      <ol class="crumb-list" id="crumb-list"></ol>
      <button type="button" class="nav-chevron" data-dir="next" title="Advance" aria-label="Next" disabled>›</button>
    </nav>

    <aside class="inspector-drawer" id="inspector-drawer">
      <button type="button" class="insp-close" aria-label="Close">×</button>
      <p class="insp-kicker" id="insp-kicker">node</p>
      <h3 class="insp-title" id="insp-title">—</h3>
      <div class="insp-grid" id="insp-grid"></div>
      <button type="button" class="card-task-btn" id="map3d-task-btn">Open terminal</button>
    </aside>

    <div class="terminal-overlay" id="terminal-overlay" hidden>
      <div class="terminal" role="dialog" aria-modal="true">
        <div class="terminal-chrome">
          <span class="terminal-title">APOS // TASK RELAY</span>
          <button type="button" class="terminal-close" id="terminal-close" aria-label="Close">×</button>
        </div>
        <div class="terminal-body">
          <div class="term-line muted">3d session linked · secure channel</div>
          <div class="term-line">assignee: <span id="term-assignee">—</span></div>
          <label class="term-label" for="term-task">task</label>
          <textarea id="term-task" class="term-textarea" rows="4" placeholder="Describe the field task…"></textarea>
          <div class="term-actions">
            <button type="button" class="term-send" id="term-send">Send</button>
          </div>
          <div class="term-log" id="term-log" aria-live="polite"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="apos-space-map-data.js"></script>
  <script type="module" src="apos-3d-map.js"></script>
  <script src="apos-map-gemini.js"></script>
</body>
</html>
