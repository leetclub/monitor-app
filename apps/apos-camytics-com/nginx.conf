server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        image/svg+xml;

    # Exact files only. "/" uses the index. Missing paths are 404, not the landing page.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.js$ {
        default_type application/javascript;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location ~* \.(css|png|jpg|jpeg|gif|svg|webp|ico|woff2)$ {
        add_header Cache-Control "public, max-age=86400" always;
    }
}
