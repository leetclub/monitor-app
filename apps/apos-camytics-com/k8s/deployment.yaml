apiVersion: apps/v1
kind: Deployment
metadata:
  name: apos-camytics-com
  namespace: camytics
  labels:
    app: apos-camytics-com
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apos-camytics-com
  template:
    metadata:
      labels:
        app: apos-camytics-com
    spec:
      containers:
        - name: web
          image: programmeradmin25/apos-camytics-com:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
