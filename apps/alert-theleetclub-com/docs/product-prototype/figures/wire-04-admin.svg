<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <style><![CDATA[
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; }
      .boxMuted { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .label { fill: #0f172a; font-size: 11px; font-weight: 600; }
      .hint { fill: #64748b; font-size: 9px; }
      .title { fill: #0f172a; font-size: 14px; font-weight: 700; }
      .cap { fill: #475569; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; }
      .navOn { fill: #ecfdf5; stroke: #22c55e; stroke-width: 1.2; }
      .navOff { fill: #fff; stroke: #cbd5e1; stroke-width: 1; }
      .tiny { fill: #475569; font-size: 8px; }
    ]]></style>
  </defs>
  <text x="8" y="18" class="cap">FIGURE 4 - ADMIN (VERTICAL SIDEBAR / ADMINPAGE.TSX)</text>
  <g transform="translate(8, 28)">
    <rect class="box" x="0" y="0" width="784" height="404" rx="8"/>
    <text x="16" y="32" class="hint" font-size="9px">Settings</text>
    <text x="16" y="56" class="title">Admin</text>
    <text x="16" y="76" class="hint" font-size="9px">Machines, Targets, access — one place.</text>
    <rect class="boxMuted" x="620" y="12" width="24" height="24" rx="4"/>
    <text x="652" y="28" class="hint" font-size="8px">Help tip</text>

    <text x="16" y="108" class="label" font-size="9px">Sections</text>
    <rect class="navOff" x="16" y="116" width="168" height="28" rx="6"/>
    <text x="28" y="134" class="label" font-size="9px">Machines</text>
    <rect class="navOn" x="16" y="150" width="168" height="28" rx="6"/>
    <text x="28" y="168" class="label" font-size="9px">Targets</text>
    <rect class="navOff" x="16" y="184" width="168" height="28" rx="6"/>
    <text x="28" y="202" class="label" font-size="9px">Area owners</text>
    <rect class="navOff" x="16" y="218" width="168" height="28" rx="6"/>
    <text x="28" y="236" class="label" font-size="9px">Who can use Alert</text>
    <rect class="navOff" x="16" y="252" width="168" height="28" rx="6"/>
    <text x="28" y="270" class="label" font-size="9px">My access</text>

    <rect class="boxMuted" x="200" y="100" width="568" height="288" rx="6"/>
    <text x="216" y="128" class="label" font-size="10px">Targets — location once + multi-product</text>
    <text x="216" y="146" class="hint" font-size="8px">Loc KD/cups · promote 1..N products each with own target · sales insights.</text>

    <rect class="box" x="216" y="158" width="320" height="28" rx="4"/>
    <text x="228" y="176" class="tiny">Machine dropdown</text>
    <text x="216" y="208" class="label" font-size="9px">Location target (KD)</text>
    <rect class="box" x="216" y="214" width="140" height="26" rx="4"/>
    <text x="228" y="231" class="tiny">e.g. 45 · Insight ▾</text>
    <text x="370" y="208" class="label" font-size="9px">Promoted products</text>
    <rect class="box" x="370" y="214" width="180" height="26" rx="4"/>
    <text x="382" y="231" class="tiny">Americano · Latte · …</text>
    <text x="216" y="268" class="label" font-size="9px">Each product target</text>
    <rect class="box" x="216" y="274" width="140" height="26" rx="4"/>
    <text x="228" y="291" class="tiny">own cups / KD</text>
    <text x="370" y="268" class="label" font-size="9px">Fleet table</text>
    <rect class="box" x="370" y="274" width="120" height="26" rx="4"/>
    <text x="382" y="291" class="tiny">1 row · expand ▾</text>
    <text x="216" y="330" class="hint" font-size="8px">Expand a location to see all promoted products + targets.</text>
  </g>
</svg>
