<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <style><![CDATA[
      .box { fill: #1e293b; stroke: #334155; stroke-width: 1.2; }
      .boxHi { fill: #1e3a5f; stroke: #3b82f6; stroke-width: 1.2; }
      .boxMain { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; }
      .boxAccent { fill: #fef2f2; stroke: #f87171; stroke-width: 1.2; }
      .tab { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .tabOn { fill: #ccfbf1; stroke: #0f766e; stroke-width: 1.2; }
      .label { fill: #0f172a; font-size: 11px; font-weight: 600; }
      .labelInv { fill: #e2e8f0; font-size: 10px; font-weight: 600; }
      .hint { fill: #64748b; font-size: 9px; }
      .hintInv { fill: #94a3b8; font-size: 8px; }
      .title { fill: #0f172a; font-size: 14px; font-weight: 700; }
      .cap { fill: #475569; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; }
      .kicker { fill: #64748b; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
    ]]></style>
  </defs>
  <text x="8" y="18" class="cap">FIGURE 1 - CLASSIC SIDEBAR vs PRO FULL-BLEED iPAD</text>
  <g transform="translate(8, 28)">
    <rect class="box" x="0" y="0" width="100" height="384" rx="6" fill="#0f172a"/>
    <text x="8" y="26" class="labelInv" font-size="11px">Classic</text>
    <rect class="boxHi" x="6" y="48" width="88" height="28" rx="4"/>
    <text x="12" y="66" class="labelInv" font-size="8px">Red Flags</text>
    <rect class="box" x="6" y="82" width="88" height="24" rx="4"/>
    <text x="12" y="98" class="labelInv" font-size="8px">Overall</text>
    <text x="6" y="372" class="hintInv">Sidebar</text>

    <!-- Pro fills remaining width -->
    <rect class="boxMain" x="112" y="0" width="672" height="40" rx="4"/>
    <text x="124" y="26" class="label" font-size="12px">Leet Alert · Pro (full width)</text>
    <text x="520" y="26" class="hint" font-size="8px">Classic · Pro</text>
    <text x="620" y="26" class="hint" font-size="8px">Sign out</text>

    <rect fill="#f8fafc" stroke="#e2e8f0" x="112" y="44" width="672" height="44" rx="0"/>
    <rect class="tabOn" x="120" y="50" width="158" height="32" rx="8"/>
    <text x="158" y="70" class="label" font-size="10px" fill="#0f766e">Red Flags</text>
    <rect class="tab" x="286" y="50" width="158" height="32" rx="8"/>
    <text x="336" y="70" class="label" font-size="10px">Overall</text>
    <rect class="tab" x="452" y="50" width="158" height="32" rx="8"/>
    <text x="498" y="70" class="label" font-size="10px">QA Visit</text>
    <rect class="tab" x="618" y="50" width="158" height="32" rx="8"/>
    <text x="670" y="70" class="label" font-size="10px">Admin</text>

    <rect class="boxMain" x="112" y="96" width="672" height="288" rx="6"/>
    <text x="124" y="120" class="kicker">Uses entire iPad canvas</text>
    <text x="124" y="144" class="title">No centered phone column</text>
    <text x="124" y="164" class="hint" font-size="9px">4 KPI tiles · 2–3 machine cards across · compare chips in one row</text>

    <rect class="boxMain" x="124" y="180" width="150" height="56" rx="8"/>
    <text x="136" y="214" class="label" font-size="10px">KPI</text>
    <rect class="boxMain" x="284" y="180" width="150" height="56" rx="8"/>
    <text x="296" y="214" class="label" font-size="10px">KPI</text>
    <rect class="boxMain" x="444" y="180" width="150" height="56" rx="8"/>
    <text x="456" y="214" class="label" font-size="10px">KPI</text>
    <rect class="boxMain" x="604" y="180" width="160" height="56" rx="8"/>
    <text x="616" y="214" class="label" font-size="10px">KPI</text>

    <rect class="boxAccent" x="124" y="250" width="210" height="100" rx="10"/>
    <text x="140" y="280" class="label" font-size="11px">Machine card</text>
    <text x="140" y="300" class="hint" font-size="8px">Col 1 of 3</text>
    <rect class="boxMain" x="348" y="250" width="210" height="100" rx="10"/>
    <text x="364" y="280" class="label" font-size="11px">Machine card</text>
    <text x="364" y="300" class="hint" font-size="8px">Col 2 of 3</text>
    <rect class="boxMain" x="572" y="250" width="192" height="100" rx="10"/>
    <text x="588" y="280" class="label" font-size="11px">Machine card</text>
    <text x="588" y="300" class="hint" font-size="8px">Col 3 of 3</text>

    <text x="124" y="372" class="hint" font-size="8px">Hard rule: on iPad Pro (1366) Pro must edge-to-edge fill — never a narrow column with gutters.</text>
  </g>
</svg>
