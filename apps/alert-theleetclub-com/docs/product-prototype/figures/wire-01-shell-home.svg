<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <style><![CDATA[
      .box { fill: #1e293b; stroke: #334155; stroke-width: 1.2; }
      .boxHi { fill: #1e3a5f; stroke: #3b82f6; stroke-width: 1.2; }
      .boxMain { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; }
      .boxAccent { fill: #fef2f2; stroke: #f87171; stroke-width: 1.2; }
      .label { fill: #0f172a; font-size: 11px; font-weight: 600; }
      .labelInv { fill: #e2e8f0; font-size: 10px; font-weight: 600; }
      .hint { fill: #64748b; font-size: 9px; }
      .hintInv { fill: #94a3b8; font-size: 8px; }
      .title { fill: #0f172a; font-size: 14px; font-weight: 700; }
      .cap { fill: #475569; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; }
      .kicker { fill: #64748b; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
      .btn { fill: #ecfdf5; stroke: #22c55e; stroke-width: 1; }
    ]]></style>
  </defs>
  <text x="8" y="18" class="cap">FIGURE 1 - CLASSIC SIDEBAR vs PRO TOP APP BAR (TOGGLE)</text>
  <g transform="translate(8, 28)">
    <rect class="box" x="0" y="0" width="120" height="384" rx="6" fill="#0f172a"/>
    <text x="10" y="26" class="labelInv" font-size="12px">Leet Alert</text>
    <text x="10" y="42" class="hintInv">Classic shell</text>
    <rect class="boxHi" x="8" y="52" width="104" height="36" rx="4"/>
    <text x="14" y="74" class="labelInv" font-size="9px">Red Flags</text>
    <rect class="box" x="8" y="94" width="104" height="32" rx="4"/>
    <text x="14" y="114" class="labelInv" font-size="9px">Overall</text>
    <rect class="box" x="8" y="132" width="104" height="32" rx="4"/>
    <text x="14" y="152" class="labelInv" font-size="9px">QA Visit</text>
    <rect class="box" x="8" y="170" width="104" height="32" rx="4"/>
    <text x="14" y="190" class="labelInv" font-size="9px">Admin</text>
    <text x="8" y="372" class="hintInv">Dark tactical sidebar</text>

    <rect class="boxMain" x="132" y="0" width="652" height="48" rx="6"/>
    <text x="144" y="18" class="label" font-size="11px">Leet Alert</text>
    <text x="144" y="34" class="hint" font-size="8px">Pro shell — top app bar (no sidebar)</text>
    <text x="280" y="28" class="label" font-size="9px">Red Flags</text>
    <text x="360" y="28" class="label" font-size="9px">Overall</text>
    <text x="420" y="28" class="label" font-size="9px">QA Visit</text>
    <text x="490" y="28" class="hint" font-size="8px">Classic · Pro</text>
    <text x="580" y="28" class="hint" font-size="8px">user@ · Sign out</text>

    <rect class="boxMain" x="132" y="56" width="652" height="328" rx="8"/>
    <text x="148" y="88" class="kicker">Light workspace</text>
    <text x="148" y="114" class="title">Soft cards · horizontal nav</text>
    <text x="148" y="138" class="hint" font-size="9px">Pro uses a different React shell: top product bar + white cards. Classic keeps the dark sidebar Stitch look.</text>

    <rect class="boxAccent" x="148" y="160" width="188" height="120" rx="10"/>
    <text x="164" y="184" class="kicker">Priority</text>
    <text x="164" y="208" class="label" font-size="12px">Red Flags</text>
    <text x="164" y="228" class="hint" font-size="8px">Machines failing checks - start here.</text>
    <text x="164" y="258" class="label" font-size="9px" fill="#b91c1c">Continue</text>

    <rect class="boxMain" x="352" y="160" width="188" height="120" rx="10"/>
    <text x="368" y="184" class="kicker">Fleet</text>
    <text x="368" y="208" class="label" font-size="12px">Overall</text>
    <text x="368" y="228" class="hint" font-size="8px">All machines &amp; roll-up KPIs.</text>
    <text x="368" y="258" class="label" font-size="9px">Continue</text>

    <rect class="boxMain" x="556" y="160" width="188" height="120" rx="10" stroke-dasharray="4 3"/>
    <text x="572" y="184" class="kicker">Configuration</text>
    <text x="572" y="208" class="label" font-size="12px">Admin</text>
    <text x="572" y="228" class="hint" font-size="8px">If role allows - machines, access.</text>
    <text x="572" y="258" class="label" font-size="9px">Continue</text>

    <text x="148" y="320" class="hint" font-size="8px">Toggle Classic · Pro in the top bar / login. Choice persists in localStorage.</text>
  </g>
</svg>
