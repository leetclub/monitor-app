  <text x="24" y="52" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">Achievement % first - period target vs actual + daily revenue side by side</text>
  <!-- Filter rail -->
  <rect x="24" y="68" width="150" height="310" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="36" y="90" fill="#cbd5e1" font-size="11" font-weight="600" font-family="Segoe UI, sans-serif">Locations</text>
  <rect x="36" y="112" width="12" height="12" rx="2" fill="#2dd4bf"/>
  <text x="54" y="122" fill="#e2e8f0" font-size="10" font-family="Segoe UI, sans-serif">Marina</text>
  <rect x="36" y="132" width="12" height="12" rx="2" fill="#2dd4bf"/>
  <text x="54" y="142" fill="#e2e8f0" font-size="10" font-family="Segoe UI, sans-serif">Salmiya</text>
  <!-- KPI row -->
  <rect x="190" y="68" width="88" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="200" y="84" fill="#64748b" font-size="8" font-family="Segoe UI, sans-serif">DEFICIT</text>
  <text x="200" y="98" fill="#e2e8f0" font-size="12" font-family="Consolas, monospace">-12.5</text>
  <rect x="286" y="68" width="88" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
