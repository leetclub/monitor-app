<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
  <rect width="800" height="360" fill="#0f172a"/>
  <text x="24" y="32" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">Performance · Multi-select charts</text>
  <text x="24" y="52" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">Filter · KPIs · target vs actual · ranking · daily + cumulative (Targets Areas)</text>
  <!-- Filter rail -->
  <rect x="24" y="68" width="150" height="270" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="36" y="90" fill="#cbd5e1" font-size="11" font-weight="600" font-family="Segoe UI, sans-serif">Locations</text>
  <rect x="36" y="102" width="12" height="12" rx="2" fill="#2dd4bf"/>
  <text x="54" y="112" fill="#e2e8f0" font-size="10" font-family="Segoe UI, sans-serif">Marina</text>
  <rect x="36" y="122" width="12" height="12" rx="2" fill="#2dd4bf"/>
  <text x="54" y="132" fill="#e2e8f0" font-size="10" font-family="Segoe UI, sans-serif">Salmiya</text>
  <rect x="36" y="142" width="12" height="12" rx="2" stroke="#64748b" fill="none"/>
  <text x="54" y="152" fill="#94a3b8" font-size="10" font-family="Segoe UI, sans-serif">Jabriya</text>
  <!-- KPI -->
  <rect x="190" y="68" width="90" height="44" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="200" y="86" fill="#64748b" font-size="8" font-family="Segoe UI, sans-serif">PERIOD KD</text>
  <text x="200" y="102" fill="#e2e8f0" font-size="13" font-family="Consolas, monospace">412.5</text>
  <rect x="290" y="68" width="90" height="44" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="300" y="86" fill="#64748b" font-size="8" font-family="Segoe UI, sans-serif">ACHIEVE</text>
  <text x="300" y="102" fill="#2dd4bf" font-size="13" font-family="Consolas, monospace">87%</text>
  <!-- Target vs actual panel -->
  <rect x="190" y="124" width="290" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="202" y="144" fill="#cbd5e1" font-size="11" font-weight="600" font-family="Segoe UI, sans-serif">Period target vs actual</text>
  <rect x="210" y="158" width="90" height="10" rx="2" fill="#475569"/>
  <rect x="210" y="172" width="70" height="10" rx="2" fill="#15803d"/>
  <rect x="210" y="192" width="90" height="10" rx="2" fill="#475569"/>
  <rect x="210" y="206" width="55" height="10" rx="2" fill="#b45309"/>
  <text x="320" y="180" fill="#64748b" font-size="9" font-family="Segoe UI, sans-serif">gray=target · color=actual</text>
  <!-- Ranking panel -->
  <rect x="494" y="124" width="282" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="506" y="144" fill="#cbd5e1" font-size="11" font-weight="600" font-family="Segoe UI, sans-serif">Achievement ranking</text>
  <rect x="520" y="160" width="180" height="12" rx="2" fill="#15803d"/>
  <rect x="520" y="180" width="140" height="12" rx="2" fill="#1d4ed8"/>
  <rect x="520" y="200" width="95" height="12" rx="2" fill="#dc2626"/>
  <line x1="700" y1="155" x2="700" y2="220" stroke="#64748b" stroke-dasharray="3 3"/>
  <!-- Daily panel -->
  <rect x="190" y="256" width="586" height="82" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="202" y="276" fill="#cbd5e1" font-size="11" font-weight="600" font-family="Segoe UI, sans-serif">Daily revenue + cumulative</text>
  <rect x="210" y="290" width="16" height="30" rx="2" fill="#2563eb"/>
  <rect x="232" y="285" width="16" height="35" rx="2" fill="#15803d"/>
  <rect x="254" y="295" width="16" height="25" rx="2" fill="#2563eb"/>
  <rect x="276" y="288" width="16" height="32" rx="2" fill="#15803d"/>
  <path d="M210 300 C 250 292, 290 285, 340 278" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="360" y="310" fill="#64748b" font-size="9" font-family="Segoe UI, sans-serif">bars = daily · line = cumulative · PNG export</text>
</svg>
