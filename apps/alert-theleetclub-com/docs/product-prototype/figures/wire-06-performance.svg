  <text x="296" y="98" fill="#2dd4bf" font-size="12" font-family="Consolas, monospace">87%</text>
  <rect x="382" y="68" width="88" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="392" y="84" fill="#64748b" font-size="8" font-family="Segoe UI, sans-serif">PERIOD KD</text>
  <text x="392" y="98" fill="#e2e8f0" font-size="12" font-family="Consolas, monospace">412.5</text>
  <!-- Achievement full width -->
  <rect x="190" y="118" width="586" height="88" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="202" y="138" fill="#cbd5e1" font-size="11" font-weight="600" font-family="Segoe UI, sans-serif">Achievement by machine</text>
  <rect x="210" y="152" width="200" height="14" rx="2" fill="#15803d"/>
  <rect x="210" y="172" width="155" height="14" rx="2" fill="#1d4ed8"/>
  <rect x="210" y="192" width="105" height="14" rx="2" fill="#dc2626"/>
  <line x1="410" y1="148" x2="410" y2="210" stroke="#64748b" stroke-dasharray="3 3"/>
  <text x="418" y="182" fill="#64748b" font-size="9" font-family="Segoe UI, sans-serif">100%</text>
  <!-- Target vs actual -->
  <rect x="190" y="218" width="286" height="160" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="202" y="238" fill="#cbd5e1" font-size="11" font-weight="600" font-family="Segoe UI, sans-serif">Period revenue by machine</text>
  <rect x="210" y="252" width="90" height="10" rx="2" fill="#475569"/>
  <rect x="210" y="266" width="70" height="10" rx="2" fill="#15803d"/>
  <text x="300" y="262" fill="#64748b" font-size="9" font-family="Segoe UI, sans-serif">92%</text>
  <rect x="210" y="286" width="90" height="10" rx="2" fill="#475569"/>
  <rect x="210" y="300" width="55" height="10" rx="2" fill="#b45309"/>
  <text x="300" y="296" fill="#64748b" font-size="9" font-family="Segoe UI, sans-serif">61%</text>
  <text x="210" y="340" fill="#64748b" font-size="9" font-family="Segoe UI, sans-serif">gray=target / color=actual</text>
  <!-- Daily revenue -->
  <rect x="490" y="218" width="286" height="160" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="502" y="238" fill="#cbd5e1" font-size="11" font-weight="600" font-family="Segoe UI, sans-serif">Daily revenue</text>
  <rect x="520" y="280" width="16" height="36" rx="2" fill="#2563eb"/>
  <rect x="542" y="272" width="16" height="44" rx="2" fill="#15803d"/>
  <rect x="564" y="288" width="16" height="28" rx="2" fill="#2563eb"/>
  <path d="M520 295 C 560 288, 620 278, 680 268" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M520 310 C 560 305, 620 300, 680 295" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="520" y="340" fill="#64748b" font-size="9" font-family="Segoe UI, sans-serif">bars + dashed target + cumulative</text>
