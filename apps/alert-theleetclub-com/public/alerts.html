<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>leet alerts · map</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="alerts-map-st.css?v=22" />
  <style>
    #hub .leet-mark {
      position: absolute; left: 50%; top: 50%;
      width: 96px; height: 44px; margin: -22px 0 0 -48px;
      object-fit: contain;
      pointer-events: none; z-index: 2;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,.45));
    }
    .dash-card {
      border: 1px solid rgba(233,228,214,.12); border-radius: 12px; padding: 16px 18px;
      background: rgba(14,17,24,.55); margin-bottom: 12px;
    }
    .dash-card h3 { font: 600 1rem/1.2 Marcellus, serif; letter-spacing: .12em; color: var(--c, #e9e4d6); }
    .dash-card p { margin: 6px 0 10px; color: rgba(233,228,214,.55); font-size: 13px; }
    .dash-card strong { font-size: 1.4rem; color: #e9e4d6; }
  </style>
</head>
<body>
  <div id="stars"></div>

  <div id="app" class="alerts-app">
    <header class="alerts-topbar">
      <div class="topbar-left" style="display:flex;align-items:center;gap:14px">
        <a class="wordmark" href="alerts.html">leet alerts</a>
        <label class="search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/>
            <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <input id="search-input" type="search" placeholder="Search alerts" autocomplete="off" />
        </label>
      </div>
      <div class="view-toggle" role="tablist" aria-label="View">
        <button type="button" class="is-active" data-view="map" role="tab" aria-selected="true">MAP</button>
        <button type="button" data-view="dashboards" role="tab" aria-selected="false">DASHBOARDS</button>
      </div>
      <button type="button" class="grid-btn" id="grid-menu" aria-label="Menu">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </button>
    </header>

    <main id="map-view">
      <div id="viewport"><div id="world">
        <div id="sky"></div>
        <div id="fanwrap"></div>
      </div></div>

      <button class="wchev" id="wchev-l" title="Previous category" aria-label="Previous category">
        <svg viewBox="0 0 14 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M 11 3 L 4 11 L 11 19"/><circle cx="4" cy="11" r="1.8" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="wchev" id="wchev-r" title="Next category" aria-label="Next category">
        <svg viewBox="0 0 14 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M 3 3 L 10 11 L 3 19"/><circle cx="10" cy="11" r="1.8" fill="currentColor" stroke="none"/></svg>
      </button>

      <div class="edge-dept" id="edge-l"></div>
      <div class="edge-dept" id="edge-r"></div>

      <div id="focus-bar" class="focus-bar" hidden>
        <button type="button" id="cat-prev" aria-label="Previous category">‹</button>
        <div class="focus-copy">
          <div id="focus-title" class="focus-title">OFFLINE</div>
          <div id="focus-sub" class="focus-sub">machines · heartbeat · connectivity</div>
        </div>
        <button type="button" id="cat-next" aria-label="Next category">›</button>
      </div>

      <div id="controls" class="chrome">
        <button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
        <div id="zoom-pct">100%</div>
        <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
        <button class="fit" id="zoom-fit" title="Fit" aria-label="Fit view">Fit</button>
      </div>
    </main>

    <section id="dash-view" class="dash-view" hidden>
      <div class="dash-grid" id="dash-grid"></div>
    </section>
  </div>

  <!-- skilltree chrome stubs (engine expects these ids) -->
  <button id="back" class="chrome" type="button">← ALL CATEGORIES</button>
  <span id="state-name" class="st-hidden"></span>
  <div id="counts" class="st-hidden"></div>
  <div id="topbar" class="st-hidden"></div>
  <div id="topsearch" class="st-hidden"></div>
  <div id="search" class="st-hidden"><input id="q" /><div class="sres"></div></div>
  <div id="nudge" class="st-hidden"></div>
  <div id="progress" class="chrome">
    <div class="p-num">0</div>
    <div class="p-lbl">OF 0 LIVE</div>
    <div class="bar"><i class="live"></i><i class="dev"></i></div>
  </div>
  <div id="about" class="st-hidden"><button class="ab-x" type="button">✕</button><div class="ab-lists" id="ab-lists-inner"></div></div>
  <div id="aboutb" class="st-hidden"></div>
  <div id="reader" class="st-hidden">
    <div class="rpanel">
      <div class="rhead"><div class="rname"></div><div class="rtag"></div>
        <div class="rbtns"><button id="rcopy"></button><a id="rdl"></a><button id="rx"></button></div>
      </div>
      <pre class="rbody"></pre>
    </div>
  </div>
  <div id="card" class="chrome">
    <button class="c-x" title="close" type="button">✕</button>
    <div class="c-state"></div>
    <div class="c-name"></div>
    <div class="c-crumb"></div>
    <div class="c-desc"></div>
    <div class="c-skillcue"></div>
    <div class="c-skills"></div>
    <div class="c-deep"></div>
    <button class="cta" type="button" id="needhelp" hidden>Need help?</button>
  </div>
  <div id="cresize"></div>
  <div id="helpdlg" class="st-hidden"><div class="hd-panel"><button class="hd-x" type="button">✕</button></div></div>
  <div id="buydlg" class="st-hidden"></div>
  <div id="mapgate" class="st-hidden"></div>
  <div id="fstrip" class="st-hidden" hidden></div>
  <div id="ab-lists" class="st-hidden"></div>
  <div id="ab-stat" class="st-hidden"></div>
  <button id="tcopy" class="st-hidden" type="button"></button>
  <button id="texport" class="st-hidden" type="button"></button>
  <button id="tfile" class="st-hidden" type="button"></button>
  <button id="timport" class="st-hidden" type="button"></button>
  <button id="treset" class="st-hidden" type="button"></button>

  <script src="apos-space-map-data.js"></script>
  <script src="alerts-map-data.js?v=22"></script>
  <script src="alerts-map-tree.js?v=22"></script>
  <script src="alerts-map-st.js?v=22"></script>
</body>
</html>
