<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APOS Operations Map | Leet Alert</title>
  <style id="critical-bg">html,body{margin:0;height:100%;background:#03050a;color:#e2e8f0;overflow:hidden}</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="apos-space-map.css">
  <link rel="stylesheet" href="apos-map-gemini.css">
  <link rel="icon" href="/favicon.ico">
</head>
<body>
  <div class="space-app" id="space-app">
    <header class="space-top">
      <div class="brand-mark" aria-label="APOS">
        <img class="brand-logo" src="assets/apos-logo.png" alt="apos" width="120" height="28" />
        <span class="brand-sub">operations map</span>
      </div>
      <div class="view-toggle" role="tablist" aria-label="View mode">
        <button type="button" class="toggle-btn active" data-view="map" role="tab" aria-selected="true">Map</button>
        <button type="button" class="toggle-btn" data-view="dashboards" role="tab" aria-selected="false">Dashboards</button>
      </div>
    </header>

    <main class="space-stage" id="space-stage">
      <canvas id="space-world" class="space-world" aria-hidden="true"></canvas>
      <svg id="space-svg" class="space-svg" role="img" aria-label="APOS hierarchy map"></svg>
      <div class="label-layer" id="label-layer" aria-hidden="true"></div>
      <div class="map-tooltip" id="map-tooltip" hidden></div>

      <div class="zoom-controls" aria-label="Zoom">
        <button type="button" class="zoom-btn" data-action="zoom-in" title="Zoom in">+</button>
        <button type="button" class="zoom-btn" data-action="zoom-out" title="Zoom out">−</button>
        <button type="button" class="zoom-btn" data-action="reset" title="Galaxy view">○</button>
      </div>

      <div class="dashboards-placeholder" id="dashboards-view" hidden>
        <p>Dashboards view — wire live panels here.</p>
      </div>
    </main>

    <nav class="space-crumb" aria-label="Hierarchy breadcrumb">
      <button type="button" class="nav-chevron" data-dir="prev" title="Go back" aria-label="Previous level">‹</button>
      <ol class="crumb-list" id="crumb-list"></ol>
      <button type="button" class="nav-chevron" data-dir="next" title="Advance" aria-label="Next sibling" disabled>›</button>
    </nav>

    <aside class="branch-card" id="branch-card" hidden>
      <button type="button" class="card-close" id="branch-card-close" aria-label="Close">&times;</button>
      <h3 class="card-title" id="branch-card-title"></h3>
      <div class="card-body" id="branch-card-body"></div>
      <button type="button" class="card-task-btn" id="branch-card-task">Open terminal</button>
    </aside>

    <div class="terminal-overlay" id="terminal-overlay" hidden>
      <div class="terminal" role="dialog" aria-modal="true" aria-labelledby="terminal-title">
        <div class="terminal-chrome">
          <span class="terminal-title" id="terminal-title">APOS // TASK RELAY</span>
          <button type="button" class="terminal-close" id="terminal-close" aria-label="Close terminal">&times;</button>
        </div>
        <div class="terminal-body">
          <div class="term-line muted">session linked · secure channel</div>
          <div class="term-line">assignee: <span id="term-assignee">—</span></div>
          <label class="term-label" for="term-task">task</label>
          <textarea id="term-task" class="term-textarea" rows="4" placeholder="Describe the field task in plain language…"></textarea>
          <div class="term-actions">
            <button type="button" class="term-send" id="term-send">Send</button>
          </div>
          <div class="term-log" id="term-log" aria-live="polite"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/d3.min.js"></script>
  <script src="apos-space-map-data.js"></script>
  <script src="apos-map-polish.js"></script>
  <script src="apos-map-engine.js"></script>
  <script src="apos-space-map.js"></script>
  <script src="apos-map-gemini.js"></script>
</body>
</html>
