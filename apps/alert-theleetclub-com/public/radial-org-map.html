<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APOS Organizational Map | Leet Alert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="radial-org-map.css">
  <link rel="icon" href="/favicon.ico">
</head>
<body>
  <div class="app-container">
    <header class="top-bar">
      <div class="header-brand">APOS</div>
      <div class="view-toggle">
        <button class="toggle-btn active" data-view="map">Map</button>
        <button class="toggle-btn" data-view="dashboards">Dashboards</button>
        <button class="toggle-btn" data-view="chart">Chart</button>
      </div>
    </header>

    <main class="canvas-container">
      <svg id="org-map-svg" class="org-map-canvas"></svg>
      
      <div class="zoom-controls">
        <button class="zoom-btn" data-action="zoom-in" title="Zoom in">+</button>
        <button class="zoom-btn" data-action="zoom-out" title="Zoom out">−</button>
        <button class="zoom-btn" data-action="reset" title="Reset view">○</button>
      </div>
    </main>

    <nav class="department-nav">
      <button class="nav-chevron" data-dir="prev" title="Previous department">‹</button>
      <div class="department-label-bottom">
        <div class="dept-name" id="dept-name">INGESTION</div>
        <div class="dept-subtitle" id="dept-subtitle">targeting · outreach · sequencing</div>
      </div>
      <button class="nav-chevron" data-dir="next" title="Next department">›</button>
    </nav>

    <div class="data-card" id="data-card">
      <button class="card-close" id="card-close" aria-label="Close">&times;</button>
      <h3 class="card-title" id="card-title">Node</h3>
      <div class="card-metrics" id="card-metrics">
        <div class="metric-row"><span class="metric-key">status:</span> <span class="metric-value">green</span></div>
      </div>
      <div class="card-footer">
        <span id="card-children" class="visually-hidden">0</span>
        <a href="#" id="new-task-link" class="new-task-link">New task →</a>
      </div>
    </div>

    <div class="task-popover" id="task-popover">
      <button class="popover-close" id="task-popover-close" aria-label="Close">&times;</button>
      <h4 class="popover-title">New Task</h4>
      <form class="task-form" id="task-form">
        <textarea 
          class="task-input" 
          id="task-desc" 
          placeholder="Describe the task..."
          rows="3"
        ></textarea>
        <div class="form-row">
          <label>
            Recipient:
            <input type="text" class="form-input" id="task-recipient" placeholder="e.g., Dispatch Agent">
          </label>
          <label>
            Priority:
            <select class="form-select" id="task-priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
          </label>
        </div>
        <button type="submit" class="submit-btn">Create</button>
      </form>
    </div>
  </div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="radial-org-map.js"></script>
</body>
</html>
